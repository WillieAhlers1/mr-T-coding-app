name: mr-minecrafts-coding-app
metadata:
  template: mr-minecrafts-coding-app@0.1.0
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    dist: dist
    language: js
    host: staticwebapp
hooks:
  predeploy:
    windows:
      shell: pwsh
      run: npm run build
    posix:
      shell: sh
      run: npm run build